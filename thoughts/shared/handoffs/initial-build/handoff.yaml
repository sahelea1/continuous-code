questions:
  - "Should the plugin be published to npm for opencode plugin install support?"
  - "Which model should be the default if user has no Ollama Cloud login?"
decisions:
  - "Used ollama-cloud/deepseek-v4-pro and deepseek-v4-flash as defaults (free tier)"
  - "Plugin registered via package name in opencode config node_modules"
  - "Two-layer enforcement: frontmatter permissions + system prompt injection"
  - "CC-v3 YAML format for handoffs (goal, now, test, done_this_session, etc.)"
  - "Docker auth copied to staging dir instead of read-only mount"
findings:
  - "OpenCode resolves plugins from config dir node_modules"
  - "Agent .md files use frontmatter (model, mode, permission, temperature, steps)"
  - "ollama-cloud provider IDs do NOT use :cloud suffix"
  - "SQLite WAL mode requires writable mount for auth.json"
  - "opencode plugin command takes npm module names, not file paths"
worked:
  - "Permission config in opencode.json effectively blocks tool use for build agent"
  - "System prompt injection via experimental.chat.system.transform hook"
  - "Local npm install (file:// protocol) for plugin registration"
  - "skill-rules.json keyword matching for intent routing"
failed:
  - "ollama-cloud/deepseek-v4-pro:cloud model ID — :cloud suffix is invalid"
  - "Relative plugin path ./dist/index.js — breaks from any other CWD"
  - "Read-only Docker mount for auth — SQLite WAL needs write access"
